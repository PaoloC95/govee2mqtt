name: Build images

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.*"
      - "ui/**"
      - "common/run.sh"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.*"
      - "ui/**"
      - "common/run.sh"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build.yml"

env:
  DAEMON_IMAGE: ghcr.io/paoloc95/govee2mqtt
  ADDON_IMAGE: ghcr.io/paoloc95/govee2mqtt-addon

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      build_sha: ${{ steps.version.outputs.build_sha }}
      daemon_tags: ${{ steps.daemon_meta.outputs.tags }}
      daemon_labels: ${{ steps.daemon_meta.outputs.labels }}
      daemon_annotations: ${{ steps.daemon_meta.outputs.annotations }}
      addon_tags: ${{ steps.addon_meta.outputs.tags }}
      addon_labels: ${{ steps.addon_meta.outputs.labels }}
      addon_annotations: ${{ steps.addon_meta.outputs.annotations }}
    steps:
      - name: Compute version facts for build.rs
        id: version
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "release" ]; then
            release_tag="${RELEASE_TAG#v}"
            build_sha=""
          else
            release_tag=""
            build_sha="${SHA}"
          fi
          {
            echo "release_tag=${release_tag}"
            echo "build_sha=${build_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Daemon image metadata
        id: daemon_meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.DAEMON_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=edge,enable=${{ github.event_name != 'release' }}

      - name: Addon image metadata
        id: addon_meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.ADDON_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=edge,enable=${{ github.event_name != 'release' }}
            type=raw,value=0.1.4,enable=${{ github.event_name == 'workflow_dispatch' }}

  daemon:
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04, platform: linux/amd64 }
          - { arch: aarch64, os: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: standalone
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            GOVEE2MQTT_RELEASE_TAG=${{ needs.init.outputs.release_tag }}
            GOVEE2MQTT_BUILD_SHA=${{ needs.init.outputs.build_sha }}
          labels: ${{ needs.init.outputs.daemon_labels }}
          outputs: type=image,name=${{ env.DAEMON_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=daemon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=daemon-${{ matrix.arch }}
      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-daemon-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  daemon-manifest:
    needs: [init, daemon]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-daemon-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multiarch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.DAEMON_IMAGE }}
          TAGS: ${{ needs.init.outputs.daemon_tags }}
          ANNOTATIONS: ${{ needs.init.outputs.daemon_annotations }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=( --tag "$tag" )
          done <<< "$TAGS"
          while IFS= read -r ann; do
            [ -n "$ann" ] && args+=( --annotation "$ann" )
          done <<< "$ANNOTATIONS"
          for digest in *; do
            args+=( "${IMAGE}@sha256:${digest}" )
          done
          docker buildx imagetools create "${args[@]}"

  addon:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [init, daemon]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04, platform: linux/amd64 }
          - { arch: aarch64, os: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: addon
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            GOVEE2MQTT_RELEASE_TAG=${{ needs.init.outputs.release_tag }}
            GOVEE2MQTT_BUILD_SHA=${{ needs.init.outputs.build_sha }}
          labels: ${{ needs.init.outputs.addon_labels }}
          outputs: type=image,name=${{ env.ADDON_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=addon-${{ matrix.arch }}
            type=gha,scope=daemon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=addon-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-addon-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  addon-manifest:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [init, addon]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-addon-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multiarch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.ADDON_IMAGE }}
          TAGS: ${{ needs.init.outputs.addon_tags }}
          ANNOTATIONS: ${{ needs.init.outputs.addon_annotations }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=( --tag "$tag" )
          done <<< "$TAGS"
          while IFS= read -r ann; do
            [ -n "$ann" ] && args+=( --annotation "$ann" )
          done <<< "$ANNOTATIONS"
          for digest in *; do
            args+=( "${IMAGE}@sha256:${digest}" )
          done
          docker buildx imagetools create "${args[@]}"
